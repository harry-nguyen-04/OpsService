services:
  ops-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ops-service
    env_file:
      - .env
    ports:
      - "${SERVER_PORT}:${SERVER_PORT}"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: ops-db
    env_file:
      - .env
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - ops_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  ops_postgres_data:
